name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build static web release
        run: npm run build
        env:
          VITE_BASE: /
      - name: Package static build
        run: |
          cd dist
          zip -r ../open-pdf-studio-web.zip .
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: OpenPDF Studio ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: open-pdf-studio-web.zip
          body: |
            ## OpenPDF Studio ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

            Private, local-first PDF workspace. Read, annotate, edit, sign, OCR, redact, compress and protect PDFs entirely in the browser.

            ### Download
            - `open-pdf-studio-web.zip`: static web build. Unzip and serve at the root of any static host, or use GitHub Pages.

            ### Dados / Data
            - 100% client-side: no document upload, account, telemetry or backend.
            - English and Portuguese UI.
            - PWA offline after first load.
            - MIT licensed.

            ### Limites / Limits
            - No certified PAdES/ICP-Brasil signatures.
            - No PDF/A, XFA, 3D/multimedia, Adobe DRM or Document Cloud.
            - Visual redaction rasterizes marked pages.
