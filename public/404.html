<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — OpenPDF Studio</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/open-pdf-studio/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fffbf8; color: #1b1c1a; }
      main { max-width: 520px; padding: 32px; text-align: center; }
      .mark { width: 54px; height: 54px; margin: 0 auto 18px; border-radius: 15px; display: grid; place-items: center; background: linear-gradient(135deg, #0b6e4f, #1b8a5a 55%, #ff7a45); color: #fff; font-weight: 900; font-size: 24px; }
      h1 { font-size: 32px; letter-spacing: -0.04em; margin: 0 0 8px; }
      p { color: #414944; line-height: 1.6; font-size: 14px; }
      a { display: inline-flex; margin-top: 14px; padding: 10px 16px; border-radius: 10px; background: #0b6e4f; color: #fff; text-decoration: none; font-weight: 700; font-size: 13px; }
      @media (prefers-color-scheme: dark) { body { background: #101412; color: #e1e3df; } p { color: #c0c9c2; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">P</div>
      <h1>Page not found</h1>
      <p>The page you requested does not exist. Open the app or return to the landing page.</p>
      <a href="/open-pdf-studio/app/">Open OpenPDF Studio</a>
    </main>
  </body>
</html>
