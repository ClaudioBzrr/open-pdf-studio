[package]
name = "openpdf-desktop"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Native OpenPDF Studio desktop app"
license = "MIT"
repository = "https://github.com/ClaudioBzrr/open-pdf-studio"

[dependencies]
anyhow = "1"
eframe = "0.32.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "image_025", "thread_safe"] }
rfd = "0.17"
sys-locale = "0.3"

[build-dependencies]
winres = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
